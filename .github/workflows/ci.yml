name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Arch 而不是 debian:stable：wlroots 0.20 要求 wayland >= 1.24、
    # libdrm >= 2.4.129、xkbcommon >= 1.8、pixman >= 0.43，而 bookworm 的
    # 1.21 / 2.4.114 / 1.5 / 0.42 一个都不满足，meson 于是退到 wrap 里逐个
    # 编 fallback（第一个是 wayland，它要 expat），链条就断在 setup。
    container:
      image: archlinux:base-devel
    env:
      # run_headless.sh 直接用继承的 XDG_RUNTIME_DIR（其余 smoke 脚本自己
      # mktemp 覆盖），容器里没有这个变量时 wayland socket 建不出来。
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      # scenefx 的 fx renderer 只走 EGL/GLES2，runner 上没有 /dev/dri。
      # 强制 surfaceless + llvmpipe：不设这个也会被 server.c 的自动回退接住，
      # 但显式写出来，启动少一次必然失败的探测。
      WLR_RENDERER_FORCE_SOFTWARE: '1'
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            meson ninja git \
            wayland wayland-protocols libxkbcommon libinput \
            pixman libdrm mesa lcms2 \
            systemd-libs seatd hwdata libliftoff libdisplay-info \
            libxcb xcb-util-errors xcb-util-wm \
            xcb-util-image xcb-util-renderutil libx11 \
            cairo pango librsvg xorg-xwayland \
            expat libffi \
            wlr-protocols \
            wayland-utils wlr-randr wl-clipboard grim jq \
            weston imagemagick file xterm \
            openbsd-netcat scdoc
      - uses: actions/checkout@v4
      # lswt 只有 AUR 包，而 capture / xwayland 两个 smoke 用它造 layer-shell
      # 窗口。现场编一次；编不出来就让它俩自己 skip，不因此判流水线失败。
      - name: Build lswt (optional)
        continue-on-error: true
        run: |
          git clone --depth 1 https://git.sr.ht/~leon_plickat/lswt /tmp/lswt
          make -C /tmp/lswt
          bin="$(find /tmp/lswt -maxdepth 2 -type f -perm -u+x -name lswt | head -1)"
          install -Dm755 "$bin" /usr/local/bin/lswt
      - name: Setup
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # scenefx 是硬依赖（scene 实现固定走它），wrap 会顺带把 wlroots 0.20
          # 拉到同一个子项目版本上——两边同名符号必须来自同一棵源码树。
          meson setup build -Dtest=enabled
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
