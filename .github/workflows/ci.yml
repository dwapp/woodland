name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Arch 而不是 debian:stable：wlroots 0.20 要求 wayland >= 1.24、
    # libdrm >= 2.4.129、xkbcommon >= 1.8、pixman >= 0.43，而 bookworm 的
    # 1.21 / 2.4.114 / 1.5 / 0.42 一个都不满足，meson 于是退到 wrap 里逐个
    # 编 fallback（第一个是 wayland，它要 expat），链条就断在 setup。
    container:
      image: archlinux:base-devel
    env:
      # run_headless.sh 直接用继承的 XDG_RUNTIME_DIR（其余 smoke 脚本自己
      # mktemp 覆盖），容器里没有这个变量时 wayland socket 建不出来。
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            meson ninja git python \
            wayland wayland-protocols libxkbcommon libinput \
            pixman libdrm mesa libglvnd lcms2 \
            systemd-libs seatd hwdata libliftoff libdisplay-info \
            libxcb xcb-util-errors xcb-util-wm \
            xcb-util-image xcb-util-renderutil libx11 \
            cairo pango librsvg xorg-xwayland \
            expat libffi \
            wlr-protocols \
            wayland-utils wlr-randr wl-clipboard grim jq \
            weston imagemagick file xterm \
            openbsd-netcat scdoc
      - uses: actions/checkout@v4
      - name: Check dependencies
        run: ./tools/check-deps.sh
      - name: Build & Test (no-effects)
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # 默认开启 effects（scenefx + fx_renderer），但 runner 没有 GPU：
          # 显式关掉，保持 pixman 纯软件渲染，让所有 smoke / 单测都能跑。
          ./tools/verify.sh --ci --no-effects-dir build --fail-on-skip
      - name: Build & Unit Test (effects)
        run: ./tools/verify.sh --single --build-dir build-effects --suite unit
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-build-and-test
          path: |
            build/meson-logs/verify-summary.json
            build/meson-logs/smoke/
            build-effects/meson-logs/verify-summary.json
          if-no-files-found: ignore

  asan-ubsan:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            meson ninja git python \
            wayland wayland-protocols libxkbcommon libinput \
            pixman libdrm mesa libglvnd lcms2 \
            systemd-libs seatd hwdata libliftoff libdisplay-info \
            libxcb xcb-util-errors xcb-util-wm \
            xcb-util-image xcb-util-renderutil libx11 \
            cairo pango librsvg xorg-xwayland \
            expat libffi \
            wlr-protocols \
            wayland-utils wlr-randr wl-clipboard grim jq \
            weston imagemagick file xterm \
            openbsd-netcat scdoc
      - uses: actions/checkout@v4
      - name: Setup, Build & Test (ASan + UBSan)
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          meson setup build-asan -Dtest=enabled -Deffects=disabled \
            -Db_sanitize=address,undefined
          if setarch "$(uname -m)" -R true 2>/dev/null; then
            setarch "$(uname -m)" -R ./tools/verify.sh --ci --no-effects-dir build-asan --fail-on-skip
          else
            ./tools/verify.sh --ci --no-effects-dir build-asan --fail-on-skip
          fi
      - name: Upload ASan/UBSan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-asan-ubsan
          path: |
            build-asan/meson-logs/verify-summary.json
            build-asan/meson-logs/smoke/
          if-no-files-found: ignore
