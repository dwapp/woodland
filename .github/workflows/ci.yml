name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            meson ninja-build gcc pkg-config git ca-certificates \
            libwayland-dev libpixman-1-dev libxkbcommon-dev \
            libinput-dev libxcb1-dev libxcb-composite0-dev \
            libxcb-icccm4-dev libxcb-render-util0-dev \
            libxcb-xfixes0-dev libxcb-errors-dev \
            libx11-xcb-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libdrm-dev libx11-dev libxcb-xkb-dev \
            libxcb-xinput-dev libxcb-present-dev \
            libseat-dev hwdata libliftoff-dev libdisplay-info-dev
      - uses: actions/checkout@v4
      - name: Setup
        run: meson setup build -Dtest=enabled
      - name: Build
        run: meson compile -C build
      - name: Test
        run: meson test -C build --print-errorlogs
